name: pimo-proxy

services:
  init-config:
    image: python:3.13-alpine
    restart: "no"
    environment:
      CPA_MANAGEMENT_KEY: ${CPA_MANAGEMENT_KEY:?Set CPA_MANAGEMENT_KEY in Dokploy Environment}
      CLIENT_API_KEY: ${CLIENT_API_KEY:?Set CLIENT_API_KEY in Dokploy Environment}
    volumes:
      - cpa-config:/config
    command:
      - python
      - -c
      - |
        import json, os
        from pathlib import Path
        path = Path('/config/config.yaml')
        if path.exists():
            print('Keeping existing persistent configuration.')
        else:
            config = {
                'config-version': 8,
                'server': {'host': '', 'port': 8317},
                'management': {
                    'allow-remote': True,
                    'secret-key': os.environ['CPA_MANAGEMENT_KEY'],
                    'disable-control-panel': False,
                },
                'access': {'api-keys': [os.environ['CLIENT_API_KEY']]},
                'oauth': {'auth-dir': '~/.cli-proxy-api'},
                'observability': {'usage': {'usage-statistics-enabled': True}},
                'routing': {'strategy': 'round-robin'},
            }
            # JSON is valid YAML; the proxy can subsequently save this as YAML.
            with path.open('x') as handle:
                path.chmod(0o600)
                json.dump(config, handle, indent=2)
            print('Created persistent CLIProxyAPI configuration.')

  cli-proxy-api:
    image: eceasy/cli-proxy-api:v8.0.64
    restart: unless-stopped
    depends_on:
      init-config:
        condition: service_completed_successfully
    command: ["./CLIProxyAPI", "-config", "/config/config.yaml"]
    expose:
      - "8317"
    volumes:
      - cpa-config:/config
      - cpa-auths:/root/.cli-proxy-api
      - cpa-logs:/CLIProxyAPI/logs
      - cpa-static:/CLIProxyAPI/static
      - cpa-plugins:/CLIProxyAPI/plugins

  cpa-usage-keeper:
    image: ghcr.io/willxup/cpa-usage-keeper:v2.1.0
    restart: unless-stopped
    depends_on:
      - cli-proxy-api
    expose:
      - "8080"
    environment:
      TZ: ${TZ:-UTC}
      CPA_BASE_URL: http://cli-proxy-api:8317
      CPA_PUBLIC_URL: ${CPA_PUBLIC_URL:?Set the public CLIProxyAPI HTTPS URL in Dokploy Environment}
      CPA_MANAGEMENT_KEY: ${CPA_MANAGEMENT_KEY:?Set CPA_MANAGEMENT_KEY in Dokploy Environment}
      REDIS_QUEUE_ADDR: cli-proxy-api:8317
      AUTH_ENABLED: "true"
      LOGIN_PASSWORD: ${KEEPER_LOGIN_PASSWORD:?Set KEEPER_LOGIN_PASSWORD in Dokploy Environment}
      WORK_DIR: /data
      BACKUP_ENABLED: "true"
    volumes:
      - keeper-data:/data

volumes:
  cpa-config:
  cpa-auths:
  cpa-logs:
  cpa-static:
  cpa-plugins:
  keeper-data:
